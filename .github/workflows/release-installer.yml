name: Release Installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release notes exist
        shell: powershell
        run: |
          $notes = "docs/releases/${{ github.ref_name }}.md"
          if (-not (Test-Path $notes)) {
            throw "Missing $notes. Add release notes before pushing the tag."
          }

      - name: Create GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "docs/releases/$tag.md"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title $tag --notes-file $notes
          } else {
            gh release create $tag --title $tag --notes-file $notes
          }

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y

      - name: Build installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\tools\Build-Installer.ps1 -BuildRoot "C:\HA-WinKiosk"

      - name: Verify installer output
        shell: powershell
        run: |
          if (-not (Test-Path ".\installer\output\HAWinKiosk-Setup.exe")) {
            throw "Installer not found at installer/output/HAWinKiosk-Setup.exe"
          }

      - name: Upload installer to release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" "installer/output/HAWinKiosk-Setup.exe" --clobber
